<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Room Model</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #0b0d14; --panel: #151a26; --fg: #eef2ff; --muted: #9aa3b8; --accent: #ffd54f; --line: rgba(255,255,255,.15); --ok: #4cc38a; --bad: #e8475f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
    header { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header a { color: var(--accent); }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; align-items: start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 6px; }
    .views { display: grid; gap: 16px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
    fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 8px 10px; }
    legend { color: var(--muted); font-size: 13px; padding: 0 4px; }
    label { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 8px; margin: 4px 0; font-size: 14px; }
    input[type=number] { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: #0f131d; color: var(--fg); font: inherit; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: #222a3b; color: var(--fg); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); color: #111; border-color: var(--accent); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    ul { list-style: none; padding: 0; margin: 0; font-size: 13px; }
    li { padding: 3px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    #verdict { font-size: 14px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <header>
    <strong>Room model</strong>
    <a href="./">← Mapper</a>
  </header>
  <main>
    <div class="views">
      <section>
        <h2>Projector view (stage pixels; the frame is the 1920×1080 image)</h2>
        <canvas id="projView" width="1120" height="630"></canvas>
      </section>
      <div class="pair">
        <section><h2>Top view</h2><canvas id="topView" width="560" height="560"></canvas></section>
        <section><h2>Side view</h2><canvas id="sideView" width="560" height="560"></canvas></section>
      </div>
    </div>
    <aside>
      <section>
        <h2>Fit</h2>
        <p id="verdict"></p>
        <ul id="coverage"></ul>
      </section>
      <section style="margin-top:16px">
        <h2>Model (metres)</h2>
        <form id="form"></form>
        <div class="row">
          <button class="primary" id="useBtn">Use in Mapper</button>
          <button id="resetBtn">Reset</button>
          <button id="exportBtn">Export JSON</button>
        </div>
        <p class="hint">Edits are saved on this device. "Use in Mapper" replaces the current calibration with zones
          generated from this model; recalibrate on the wall afterwards.</p>
      </section>
    </aside>
  </main>
  <script type="module" src="js/model-view.js"></script>
</body>
</html>
